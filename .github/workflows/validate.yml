name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check application syntax
        run: python -m py_compile app.py

      - name: Validate notebooks, code-cell syntax, and required files
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          required = [
              Path("README.md"),
              Path("LICENSE"),
              Path("CITATION.cff"),
              Path("app.py"),
              Path("requirements.txt"),
              Path("requirements-research.txt"),
              Path("notebooks/TigrinyaLens_Colab_Demo.ipynb"),
              Path("notebooks/TigrinyaLens_Research.ipynb"),
              Path("docs/index.html"),
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))

          notebook_paths = [
              Path("notebooks/TigrinyaLens_Colab_Demo.ipynb"),
              Path("notebooks/TigrinyaLens_Research.ipynb"),
          ]

          for path in notebook_paths:
              notebook = json.loads(path.read_text(encoding="utf-8"))
              if notebook.get("nbformat") != 4 or not isinstance(notebook.get("cells"), list):
                  raise SystemExit(f"Invalid notebook structure: {path}")

              checked = 0
              for index, cell in enumerate(notebook["cells"]):
                  if cell.get("cell_type") != "code":
                      continue
                  source = "".join(cell.get("source", []))
                  if not source.strip():
                      continue

                  # Strip standalone IPython magics and shell commands.
                  python_lines = [
                      line for line in source.splitlines()
                      if not line.lstrip().startswith(("%", "!"))
                  ]
                  code = "\n".join(python_lines).strip()
                  if not code:
                      continue

                  try:
                      ast.parse(code, filename=f"{path}:cell-{index}")
                  except SyntaxError as exc:
                      raise SystemExit(
                          f"Python syntax error in {path}, cell {index}: {exc}"
                      ) from exc
                  checked += 1

              print(f"Validated {path}: {len(notebook['cells'])} cells, {checked} Python code cells")

          print("Repository structure, notebook JSON, and Python syntax checks passed.")
          PY
